<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профіль · TimeTracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230d7c66'/%3E%3Cpath d='M8 4v4l2.5 1.5' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/theme.js"></script>
</head>
<body data-auth="user">
<div id="tt-navbar"></div>
<main class="container py-4" style="max-width: 960px">
    
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="h3 tt-page-title mb-1" id="title">Профіль</h1>
            <div class="text-body-secondary" id="subtitle"></div>
        </div>
        <div class="d-flex flex-wrap gap-2"></div>
    </div>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="tt-avatar" style="width:3.5rem;height:3.5rem;font-size:1.2rem" id="avatar"></span>
                    <div><div class="fs-5 fw-semibold" id="name"></div><div class="text-body-secondary" id="email"></div><div id="role"></div></div>
                </div>
                <dl class="row mb-0" id="details"></dl>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header bg-transparent"><h2 class="h6 mb-0 py-1">Зміна пароля</h2></div>
                <div class="card-body">
                    <form id="password-form" novalidate>
                        <div class="mb-3"><label class="form-label" for="current_password">Поточний пароль</label>
                            <input class="form-control" type="password" id="current_password" name="current_password" autocomplete="current-password"></div>
                        <div class="mb-3"><label class="form-label" for="new_password">Новий пароль</label>
                            <input class="form-control" type="password" id="new_password" name="new_password" autocomplete="new-password">
                            <div class="form-text">Від 8 до 72 символів</div></div>
                        <div class="mb-4"><label class="form-label" for="new_password_confirmation">Повторіть новий пароль</label>
                            <input class="form-control" type="password" id="new_password_confirmation" name="new_password_confirmation" autocomplete="new-password"></div>
                        <button class="btn btn-primary" type="submit">Змінити пароль</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/format.js"></script>
<!-- Мок-сервер: використовується, лише коли TT.config.USE_MOCK = true -->
<script src="assets/js/mock/db.js"></script>
<script src="assets/js/mock/server.js"></script>
<script src="assets/js/mock/routes/auth.js"></script>
<script src="assets/js/mock/routes/users.js"></script>
<script src="assets/js/mock/routes/time.js"></script>
<script src="assets/js/mock/routes/leaves.js"></script>
<script src="assets/js/mock/routes/reports.js"></script>
<script src="assets/js/mock/routes/holidays.js"></script>
<!-- Застосунок -->
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/profile.js"></script>
</body>
</html>
