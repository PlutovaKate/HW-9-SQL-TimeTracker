<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Головна · TimeTracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230d7c66'/%3E%3Cpath d='M8 4v4l2.5 1.5' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <script src="assets/js/theme.js"></script>
</head>
<body data-auth="user">
<div id="tt-navbar"></div>
<main class="container py-4">
    
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="h3 tt-page-title mb-1" id="greeting">Привіт!</h1>
            <div class="text-body-secondary" id="today"></div>
        </div>
        <div class="d-flex flex-wrap gap-2"><button class="btn btn-outline-secondary" id="refresh" type="button"><i class="bi bi-arrow-clockwise me-1"></i>Оновити</button></div>
    </div>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card tt-state mb-4" id="state-card" data-state="off_duty">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-wrap justify-content-between gap-2">
                        <div>
                            <div class="text-uppercase small opacity-75">Зараз</div>
                            <div class="fs-4 fw-semibold d-flex align-items-center" id="state-label">…</div>
                        </div>
                        <div class="small opacity-75 text-sm-end" id="state-since"></div>
                    </div>
                    <div class="my-4">
                        <div class="small opacity-75 mb-1">Відпрацьовано сьогодні (без обіду)</div>
                        <div class="tt-clock" id="clock">00:00:00</div>
                    </div>
                    <div class="d-flex flex-wrap gap-2" id="actions"></div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <h2 class="h6 mb-0">Мій день</h2>
                        <div class="small text-body-secondary">
                            <span class="tt-legend-dot" style="background:var(--tt-work)"></span>робота
                            <span class="tt-legend-dot ms-3" style="background:var(--tt-lunch)"></span>обід
                            <span class="tt-legend-dot ms-3 bg-danger"></span>зараз
                        </div>
                    </div>
                    <div class="tt-timeline" id="timeline"></div>
                    <div class="tt-timeline-scale mt-1" id="timeline-scale"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-transparent"><h2 class="h6 mb-0 py-1">Записи за сьогодні</h2></div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr><th>Тип</th><th>Початок</th><th>Кінець</th><th>Тривалість</th><th></th></tr></thead>
                        <tbody id="today-entries"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="row g-3 mb-4">
                <div class="col-6"><div class="card h-100"><div class="card-body">
                    <div class="tt-stat-label">Відпрацьовано</div><div class="tt-stat fs-5" id="tile-worked">—</div>
                </div></div></div>
                <div class="col-6"><div class="card h-100"><div class="card-body">
                    <div class="tt-stat-label">Обід</div><div class="tt-stat fs-5" id="tile-lunch">—</div>
                </div></div></div>
                <div class="col-12"><div class="card"><div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="tt-stat-label">Норма дня</span>
                        <span class="small text-body-secondary">початок о <strong id="plan-start">—</strong> · <span id="plan-norm">—</span></span>
                    </div>
                    <div class="progress mb-2" role="progressbar" aria-label="Виконання норми" aria-valuemin="0" aria-valuemax="100" style="height:.6rem">
                        <div class="progress-bar" id="norm-bar" style="width:0%"></div>
                    </div>
                    <div class="small text-body-secondary" id="norm-text"></div>
                </div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                    <h2 class="h6 mb-0 py-1">Відпустка</h2><a class="small" href="leaves.html">Подати заявку</a>
                </div>
                <div class="card-body" id="balance"><div class="placeholder-glow"><span class="placeholder col-8"></span></div></div>
            </div>

            <div class="card">
                <div class="card-header bg-transparent"><h2 class="h6 mb-0 py-1">Найближчі відсутності</h2></div>
                <ul class="list-group list-group-flush" id="upcoming"></ul>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/format.js"></script>
<!-- Мок-сервер: використовується, лише коли TT.config.USE_MOCK = true -->
<script src="assets/js/mock/db.js"></script>
<script src="assets/js/mock/server.js"></script>
<script src="assets/js/mock/routes/auth.js"></script>
<script src="assets/js/mock/routes/users.js"></script>
<script src="assets/js/mock/routes/time.js"></script>
<script src="assets/js/mock/routes/leaves.js"></script>
<script src="assets/js/mock/routes/reports.js"></script>
<script src="assets/js/mock/routes/holidays.js"></script>
<!-- Застосунок -->
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
